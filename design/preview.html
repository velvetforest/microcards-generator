<!doctype html>
<html lang="en" data-palette="pink" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro Cards Design</title>
<link rel="stylesheet" href="micro-cards-design.css">
<style>
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 24px; }
  .stack { display: grid; gap: 12px; }
  h2 { margin: 28px 0 12px; font-size: 15px; color: var(--mc-strong); }
</style>
</head>
<body class="mc-page">
<div class="wrap">
  <div class="bar">
    <h1 class="mc-logo">Micro Cards</h1>
    <div class="row">
      <div class="row" id="swatches" role="group" aria-label="Palette"></div>
      <button class="mc-btn" id="theme">Light / dark</button>
    </div>
  </div>
  <section class="mc-glass stack">
    <div class="row"><button class="mc-btn">Upload files</button><span style="font-size:12px;color:var(--mc-muted)">Glass panel in dark mode, solid in light mode.</span></div>
    <textarea class="mc-field" rows="3" placeholder="Paste text here"></textarea>
    <div class="row"><button class="mc-btn mc-btn--primary">Summarize</button><button class="mc-btn mc-btn--alt">Keep original</button></div>
  </section>
  <h2>Folders</h2>
  <div class="grid">
    <div class="mc-folder"><svg viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="mcSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient></defs><path class="mc-folder__fill" d="M8 24a6 6 0 0 1 6-6h22l8 9h38a6 6 0 0 1 6 6v39a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z"/><path class="mc-folder__sheen" d="M8 24a6 6 0 0 1 6-6h22l8 9h38a6 6 0 0 1 6 6v39a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="url(#mcSheen)"/></svg><div class="mc-folder__name">Mạng máy tính</div><div class="mc-folder__count">12 card sets</div></div>
    <div class="mc-folder"><svg viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="mcSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient></defs><path class="mc-folder__fill" d="M8 24a6 6 0 0 1 6-6h22l8 9h38a6 6 0 0 1 6 6v39a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z"/><path class="mc-folder__sheen" d="M8 24a6 6 0 0 1 6-6h22l8 9h38a6 6 0 0 1 6 6v39a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="url(#mcSheen)"/></svg><div class="mc-folder__name">Kiến trúc máy tính</div><div class="mc-folder__count">8 card sets</div></div>
    <div class="mc-folder"><svg viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="mcSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient></defs><path class="mc-folder__fill" d="M8 24a6 6 0 0 1 6-6h22l8 9h38a6 6 0 0 1 6 6v39a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z"/><path class="mc-folder__sheen" d="M8 24a6 6 0 0 1 6-6h22l8 9h38a6 6 0 0 1 6 6v39a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="url(#mcSheen)"/></svg><div class="mc-folder__name">Giải tích 2</div><div class="mc-folder__count">5 card sets</div></div>
  </div>
  <h2>Study card</h2>
  <article class="mc-card" style="max-width:440px">
    <header class="mc-card__head"><span class="mc-badge">01. Bài 1</span><h3 class="mc-card__title">Luồng cực đại</h3></header>
    <div class="mc-card__body">Luồng cực đại bằng <mark class="mc-mark">lát cắt cực tiểu</mark>.</div>
    <footer class="mc-card__foot">Micro Cards</footer>
  </article>
</div>
<script>
  var root = document.documentElement, list = [{"id":"pink","name":"Pink","sw":"#E89CAE"},{"id":"sage","name":"Sage","sw":"#97B3AE"},{"id":"mint","name":"Mint","sw":"#D2E0D3"},{"id":"sand","name":"Sand","sw":"#D6CBBF"},{"id":"ivory","name":"Ivory","sw":"#F0EEEA"},{"id":"lavender","name":"Lavender","sw":"#C9B8E8"},{"id":"burgundy","name":"Burgundy","sw":"#B57A8C"},{"id":"cosmic","name":"Cosmic Orange","sw":"#E0A17A"},{"id":"teal","name":"Teal","sw":"#7FB5B8"},{"id":"rosegold","name":"Rose Gold","sw":"#DDB3A4"},{"id":"sky","name":"Light Blue","sw":"#A9CDE3"},{"id":"violet","name":"Violet","sw":"#A99BD6"}];
  var box = document.getElementById('swatches');
  function mark() { [].forEach.call(box.children, function (b) { b.setAttribute('aria-pressed', b.dataset.id === root.dataset.palette); }); }
  list.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'mc-swatch'; b.title = p.name; b.setAttribute('aria-label', p.name); b.dataset.id = p.id; b.style.background = p.sw;
    b.onclick = function () { root.dataset.palette = p.id; mark(); };
    box.appendChild(b);
  });
  document.getElementById('theme').onclick = function () { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; };
  mark();
</script>
</body>
</html>
